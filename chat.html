<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Assistant IA | Digitalblueskye</title>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        // Cette page ne charge pas scripts/translator.js : sans ceci,
        // document.documentElement.lang restait fige sur "fr" apres un
        // changement de langue depuis la pop-up compte (isEnglish() dans
        // dbs-auth.js ne lit que cet attribut, pas localStorage directement).
        const savedLanguage = (localStorage.getItem('language') || '').toLowerCase().startsWith('en') ? 'en' : 'fr';
        document.documentElement.lang = savedLanguage;

        // Route le chat via le proxy IA authentifie (session + rate limit +
        // journalisation ai_usage_events), au lieu de l'appel direct historique
        // au Worker IA. Sans danger : chat.html exige deja une connexion avant
        // tout envoi de message (voir data-chat-gate plus bas). Voir
        // docs/CHATBOT_AUTH_SECURITY.md.
        //
        // Exception : la "connexion locale de test (dev)" (localhost sans
        // vrai cookie de session, voir dbs-auth.js/devLogin) n'a aucune
        // session cote api.digitalblueskye.com. La forcer vers le proxy y
        // ferait echouer chaque message en 401. Une vraie connexion OAuth en
        // localhost (cookie cross-site reel) continue elle de passer par le
        // proxy normalement.
        let hasFakeDevSession = false;
        try {
          hasFakeDevSession = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)
            && Boolean(localStorage.getItem('dbs_dev_session'));
        } catch (_) { hasFakeDevSession = false; }

        if (!hasFakeDevSession) {
          const apiBase = (String(window.DBS_API_BASE || '').trim().replace(/\/+$/, '')) || 'https://api.digitalblueskye.com';
          window.DBS_AI_ENDPOINT = `${apiBase}/ai/chat`;
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css?v=20260729-rag-overflow-fix" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <meta name="theme-color" content="#1f1d2b">
  </head>
  <body class="chat-page">
    <!-- Etat non connecte : la source de verite reste /auth/me (voir dbs-auth.js).
         Ce bloc reste visible tant que l'authentification n'a pas ete confirmee ;
         la modale de connexion s'ouvre par-dessus automatiquement (voir script ci-dessous). -->
    <a href="/index.html" class="profile-floating-logo" title="Retour à l'accueil" aria-label="Retour à l'accueil">
      <img src="/assets/images/logo/DigitalBlueSkye-Logo.png" alt="Digitalblueskye" width="42" height="42" />
    </a>
    <div class="chat-page-gate" data-chat-gate>
      <h1>Assistant IA Digital Blue Skye</h1>
      <p data-chat-gate-text>Connectez-vous pour accéder à votre assistant IA.</p>
      <button type="button" class="dbs-profile-save" data-chat-gate-signin>Se connecter</button>
    </div>

    <!-- Modale de confirmation de déconnexion -->
    <div class="chat-logout-confirmation" data-chat-logout-confirmation aria-hidden="true">
      <div class="chat-logout-confirmation-backdrop" data-chat-logout-close></div>
      <div class="chat-logout-confirmation-panel" role="dialog" aria-modal="true" aria-labelledby="chat-logout-title">
        <h2 id="chat-logout-title" data-chat-logout-title>Êtes-vous sûr de vouloir vous déconnecter ?</h2>
        <p data-chat-logout-desc>Vous serez déconnecté de votre compte.</p>
        <div class="chat-logout-confirmation-actions">
          <button type="button" class="chat-logout-confirmation-yes" data-chat-logout-confirm data-chat-logout-yes>Oui</button>
          <button type="button" class="chat-logout-confirmation-no" data-chat-logout-close data-chat-logout-no>Non</button>
        </div>
      </div>
    </div>

    <!--
      Note technique : dbs-auth.js et ai-assistant.js injectent tout le reste
      du DOM (rail, panneau, etc.) dynamiquement, exactement comme sur les
      autres pages. La classe body.chat-page indique a ai-assistant.js qu'il
      doit ouvrir + maximizer le panneau automatiquement (au lieu du mode
      bulle flottante) une fois la session confirmee. Voir docs/CHATBOT_AUTH_SECURITY.md.
    -->
    <script src="/scripts/dbs-auth.js"></script>
    <script src="/scripts/ai-assistant.js"></script>
    <script>
      (function () {
        const gate = document.querySelector('[data-chat-gate]');
        const gateText = document.querySelector('[data-chat-gate-text]');
        const signInBtn = document.querySelector('[data-chat-gate-signin]');

        // chat.html ne charge pas scripts/translator.js (voir commentaire en
        // tete de fichier) : ces quelques textes statiques (porte d'acces et
        // modale de deconnexion) doivent donc etre traduits ici a la main,
        // a partir de document.documentElement.lang deja pose plus haut.
        function isEnglish() {
          return (document.documentElement.lang || '').toLowerCase().startsWith('en');
        }
        function translateStaticTexts() {
          const en = isEnglish();
          if (gateText && !gateText.dataset.authError) {
            gateText.textContent = en
              ? 'Sign in to access your AI assistant.'
              : 'Connectez-vous pour accéder à votre assistant IA.';
          }
          if (signInBtn) signInBtn.textContent = en ? 'Sign in' : 'Se connecter';
          const gateTitle = document.querySelector('[data-chat-gate] h1');
          if (gateTitle) gateTitle.textContent = en ? 'AI Assistant Digital Blue Skye' : 'Assistant IA Digital Blue Skye';
          const logoutTitle = document.querySelector('[data-chat-logout-title]');
          const logoutDesc = document.querySelector('[data-chat-logout-desc]');
          const logoutYes = document.querySelector('[data-chat-logout-yes]');
          const logoutNo = document.querySelector('[data-chat-logout-no]');
          if (logoutTitle) logoutTitle.textContent = en ? 'Are you sure you want to sign out?' : 'Êtes-vous sûr de vouloir vous déconnecter ?';
          if (logoutDesc) logoutDesc.textContent = en ? 'You will be signed out of your account.' : 'Vous serez déconnecté de votre compte.';
          if (logoutYes) logoutYes.textContent = en ? 'Yes' : 'Oui';
          if (logoutNo) logoutNo.textContent = en ? 'No' : 'Non';
        }
        translateStaticTexts();

        function render() {
          let user = null;
          try {
            user = window.DBSAuth && window.DBSAuth.isAuthenticated() ? window.DBSAuth.getCachedUser() : null;
          } catch (error) {
            console.warn('[chat] auth read failed, showing sign-in gate', error);
          }
          if (gate) gate.hidden = Boolean(user);
          if (user) {
            try { window.DBSAuth?.closeAuthModal?.(); } catch (_) { /* no-op */ }
          } else {
            try { window.DBSAuth?.openAuthModal?.(); } catch (_) { /* no-op */ }
          }
        }

        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('auth') === 'error' && gateText) {
            gateText.dataset.authError = 'true';
            gateText.textContent = isEnglish() ? 'Sign-in failed. Please try again.' : "La connexion a échoué. Merci de réessayer.";
          }
          if (params.has('auth')) {
            params.delete('auth');
            params.delete('reason');
            const query = params.toString();
            history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
          }
        } catch (_) { /* no-op */ }

        signInBtn?.addEventListener('click', () => { try { window.DBSAuth?.openAuthModal?.(); } catch (_) { /* no-op */ } });
        document.addEventListener('dbs-auth-changed', render);
        render();
        window.DBSAuth?.refreshSession?.();
      })();
    </script>
    <script src="/scripts/scroll-to-top.js"></script>
    <script src="/scripts/chat-bg-constellation.js"></script>
  </body>
</html>
