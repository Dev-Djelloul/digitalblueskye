name = "digitalblueskye-api"
main = "worker-api.js"
compatibility_date = "2026-03-02"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "digitalblueskye"
database_id = "eeb9d1b0-26ed-48a1-beb3-b0a944765174"

[[services]]
binding = "AI_WORKER"
service = "digitalblueskye-ai"

# Envoi de l'email de connexion (magic link, cf. cloudflare/auth.js). Le
# domaine utilise dans EMAIL_FROM_ADDRESS doit d'abord etre onboarde :
#   wrangler email sending enable digitalblueskye.com
[[send_email]]
name = "EMAIL"

[vars]
ALLOWED_ORIGIN = "https://digitalblueskye.com,https://www.digitalblueskye.com,https://digitalblueskye.netlify.app"
COMMENTS_REQUIRE_APPROVAL = "false"
# --- Authentification serveur OAuth (cf. cloudflare/auth.js) ---
# Origine du front autorisee pour CORS avec credentials (cookie de session).
FRONTEND_ORIGIN = "https://digitalblueskye.com"
# URL publique de CE Worker API (base des redirect_uri OAuth et du lien magique).
AUTH_BASE_URL = "https://digitalblueskye-api.djelloulabid75.workers.dev"
# Adresse d'envoi du lien de connexion par email (domaine onboarde sur Email Sending).
EMAIL_FROM_ADDRESS = "connexion@digitalblueskye.com"
# Rate limiting IA (par heure) et connexion par email (par heure et par adresse).
AI_RATE_LIMIT_USER = "50"
AI_RATE_LIMIT_IP = "10"
EMAIL_LOGIN_RATE_LIMIT = "5"
# SameSite du cookie de session : "None" (defaut prod, cross-site Netlify<->Worker)
# ou "Lax" si un jour un domaine API same-site (api.digitalblueskye.fr) est utilise.
# AUTH_COOKIE_SAMESITE = "None"
#
# Configure ADMIN_TOKEN as a Wrangler secret:
# wrangler secret put ADMIN_TOKEN -c cloudflare/wrangler.api.toml
# Optional but recommended for the Santé dashboard to query digitalblueskye-ai:
# wrangler secret put AI_HEALTH_TOKEN -c cloudflare/wrangler.api.toml
# Set the same value as HEALTH_CHECK_TOKEN on cloudflare/wrangler.ai.toml.
#
# --- Secrets OAuth a configurer (JAMAIS en clair dans ce fichier) ---
# wrangler secret put GOOGLE_CLIENT_ID -c cloudflare/wrangler.api.toml
# wrangler secret put GOOGLE_CLIENT_SECRET -c cloudflare/wrangler.api.toml
# wrangler secret put GITHUB_CLIENT_ID -c cloudflare/wrangler.api.toml
# wrangler secret put GITHUB_CLIENT_SECRET -c cloudflare/wrangler.api.toml
# wrangler secret put AUTH_SESSION_SECRET -c cloudflare/wrangler.api.toml
