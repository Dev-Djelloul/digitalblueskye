name = "digitalblueskye-ai"
main = "worker-openrouter.js"
compatibility_date = "2026-06-18"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "digitalblueskye"
database_id = "eeb9d1b0-26ed-48a1-beb3-b0a944765174"

# Health dashboard auth:
# Either configure ADMIN_TOKEN on this worker too, or prefer a dedicated shared token:
# wrangler secret put HEALTH_CHECK_TOKEN -c cloudflare/wrangler.ai.toml

# Completion Guard (cf. cloudflare/completionGuard.js) — actif par defaut.
# Si OpenRouter tronque une reponse longue (finish_reason=length), le routeur
# relance le meme modele pour continuer, fusionne sans duplication, puis ferme
# les structures Markdown ouvertes (code/tableaux/listes/citations/titres)
# avant d'envoyer au frontend. Variables optionnelles :
#   COMPLETION_GUARD_ENABLED = "false"        # desactive entierement le guard
#   COMPLETION_GUARD_MAX_CONTINUATIONS = "2"  # 0..3 (defaut 2)
# A definir via [vars] ou `wrangler secret put` si besoin de surcharger.

# Prompt Orchestrator (cf. cloudflare/promptOrchestrator.js) — actif par
# defaut. Detecte l'intention utilisateur (regles, sans LLM), planifie les
# capacites, et compose un prompt systeme modulaire compact a la place du
# monolithe. Toute erreur => repli automatique sur le prompt monolithique.
#   PROMPT_ORCHESTRATOR_ENABLED = "false"     # revient au prompt monolithique

# Response Quality Controller (cf. cloudflare/responseQualityController.js) —
# actif par defaut. Analyse la reponse finale (apres Completion Guard) :
# score 0-100 deterministe (aucun appel IA), puis SEND / AUTO_REPAIR (reparation
# locale du Markdown) / RETRY_MODEL (1 seul retry max, meme modele/temperature,
# instruction systeme additionnelle). Toute erreur => la reponse part inchangee.
#   RESPONSE_QUALITY_CONTROLLER_ENABLED = "false"   # desactive entierement le RQC
#
# Lot 7.1 — Auto-Improver : action intermediaire IMPROVE_WITH_MODEL entre
# AUTO_REPAIR et RETRY_FULL. Si la reponse contient du contenu utile mais ne
# respecte pas le format demande (tableau/liste/citation/code/sources/titre/
# conclusion manquant), le MEME modele est sollicite une seule fois pour
# reecrire la reponse existante (jamais regeneree de zero) en corrigeant
# uniquement les problemes identifies. Si vide/irrecuperable => RETRY_FULL
# (regeneration complete, alias historique RETRY_MODEL). Si l'amelioration
# echoue, repli sur repairResponse() local puis envoi de la meilleure
# version disponible — aucune interruption de service.

# RAG vectoriel (necessite Workers Paid) :
# 1. Appliquer la table rag_chunks : wrangler d1 execute digitalblueskye --file=cloudflare/d1/schema.sql -c cloudflare/wrangler.ai.toml
# 2. wrangler vectorize create digitalblueskye-rag --dimensions=768 --metric=cosine
# 3. IMPORTANT : Vectorize exige un index de metadata explicite pour pouvoir
#    filtrer sur un champ (sinon le filtre echoue silencieusement et le code
#    retombe sur une recherche non filtree + re-filtrage cote Worker) :
#    wrangler vectorize create-metadata-index digitalblueskye-rag --property-name=projectId --type=string
# 4. Decommenter les deux blocs ci-dessous puis redeployer (npx wrangler deploy -c cloudflare/wrangler.ai.toml).
# Tant que ces bindings sont absents, getVectorStoreProvider() retourne null et
# le RAG navigateur (cote client) reste utilise sans regression.
#
# ── Migration embeddings bge-m3 — EFFECTUEE le 2026-07-13 ──────────────────
# bge-base-en-v1.5 (768 dims) etait un modele ANGLAIS : similarite degradee
# sur les contenus francais. @cf/baai/bge-m3 (1024 dims) est multilingue.
# Etat : index digitalblueskye-rag-m3 cree (+ metadata-index projectId et
# documentId), binding et [vars] bascules ci-dessous. Apres deploiement,
# REINDEXER les chunks existants (les vecteurs 768 dims ne sont pas
# reutilisables) via le mode serveur rag_reindex (pagination keyset par
# rowid, idempotent, protege par Bearer ADMIN_TOKEN ou KNOWLEDGE_ADMIN_TOKEN).
# IMPORTANT : lancer la boucle immediatement apres le deploiement (l'index
# neuf est VIDE : le RAG ne retourne rien tant que la reindexation n'est pas
# finie — ~1 a 3 min pour ~850 chunks) et eviter d'importer/supprimer des
# documents pendant la fenetre. Boucle (repartir de nextCursor tant que
# done=false ; si failed > 0, rejouer le MEME cursor) :
#   CURSOR=0; while :; do \
#     R=$(curl -s https://digitalblueskye-ai.djelloulabid75.workers.dev \
#       -H "Content-Type: application/json" -H "Authorization: Bearer $ADMIN_TOKEN" \
#       -d "{\"mode\":\"rag_reindex\",\"cursor\":$CURSOR,\"limit\":40}"); \
#     echo "$R"; \
#     [ "$(echo "$R" | jq -r .failed)" != "0" ] && continue; \
#     [ "$(echo "$R" | jq -r .done)" = "true" ] && break; \
#     CURSOR=$(echo "$R" | jq -r .nextCursor); done
# Valider la COMPLETUDE : wrangler vectorize info digitalblueskye-rag-m3
# (vectorCount) doit egaler SELECT COUNT(*) FROM rag_chunks ; puis
# POST { "mode": "rag_diagnose" } et quelques requetes RAG reelles en
# francais ; ajuster RAG_SIMILARITY_THRESHOLD si besoin.
# Enfin, supprimer l'ancien index : wrangler vectorize delete digitalblueskye-rag
#
# Diagnostic independant d'OpenRouter : POST { "mode": "rag_diagnose" } sur ce
# Worker -> teste embedding + upsert + query + delete et renvoie le detail de
# chaque etape (utile si le LLM est en 429/402 et qu'on veut juste valider le
# pipeline RAG).
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTOR_INDEX"
# Migration bge-m3 effectuée le 2026-07-13 : nouvel index 1024 dims (l'ancien
# digitalblueskye-rag en 768 dims reste intact tant que la réindexation n'est
# pas validée — le supprimer ensuite : wrangler vectorize delete digitalblueskye-rag).
index_name = "digitalblueskye-rag-m3"

# Knowledge Orchestrator (cf. cloudflare/knowledge/) — active la couche
# documentaire transverse (RAG + Project Memory) sur le chat. Obsidian reste
# desactive separement (KNOWLEDGE_OBSIDIAN_ENABLED) tant que le connecteur
# n'a pas ete valide en isolation. Rollback instantane : repasser
# KNOWLEDGE_ORCHESTRATOR_ENABLED a "false" et redeployer (aucun changement
# de code requis, le flag est verifie a chaque requete).
#   DEBUG = "true"   # optionnel : active la telemetrie knowledge_orchestrator_debug
#                     # dans les logs Workers et dans /admin/health.knowledge_orchestrator.debug_last_query
[vars]
KNOWLEDGE_ORCHESTRATOR_ENABLED = "true"
KNOWLEDGE_OBSIDIAN_ENABLED = "false"
# Modele principal (decision 2026-07-12) : Claude Haiku 4.5 via OpenRouter —
# modele PAYANT (necessite des credits OpenRouter), multilingue, tres au-dessus
# des modeles gratuits pour le suivi d'instructions et le Markdown structure.
# Replis : modeles payants economiques, puis la cascade Cloudflare AI habituelle.
OPENROUTER_MODEL = "anthropic/claude-haiku-4.5"
OPENROUTER_FALLBACK_MODELS = "google/gemini-2.5-flash-lite,mistralai/mistral-small-3.2-24b-instruct"
# Embeddings multilingues (migration 2026-07-13, cf. cloudflare/embeddings.js) :
# bge-m3 remplace bge-base-en-v1.5 (anglais uniquement) — indispensable pour la
# similarité sémantique sur les contenus FRANÇAIS du site. Seuil recalibré :
# bge-m3 score plus bas que bge-base ; à ajuster après tests réels si besoin.
EMBEDDING_MODEL = "@cf/baai/bge-m3"
RAG_SIMILARITY_THRESHOLD = "0.60"
