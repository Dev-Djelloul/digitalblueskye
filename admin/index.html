<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Back-Office</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap");

    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --bg-radial: radial-gradient(circle at 18% 0%, rgba(93, 93, 255, 0.22), transparent 32%),
        radial-gradient(circle at 82% 10%, rgba(200, 34, 255, 0.16), transparent 30%),
        linear-gradient(145deg, #0b1020 0%, #15172a 44%, #11101d 100%);
      --surface: rgba(34, 36, 57, 0.82);
      --surface-2: rgba(47, 50, 78, 0.92);
      --surface-3: rgba(255, 255, 255, 0.06);
      --text: #f4f6ff;
      --muted: #b8c2dc;
      --border: rgba(143, 151, 255, 0.24);
      --border-strong: rgba(143, 151, 255, 0.42);
      --brand: #7c83ff;
      --brand-dark: #b16cff;
      --danger: #ff7a8a;
      --success: #54d6a1;
      --warning: #ffd166;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
      --focus: 0 0 0 3px rgba(124, 131, 255, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-radial);
      color: var(--text);
      font-family: "Google Sans Flex", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      padding: 0 14px;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover {
      border-color: var(--border-strong);
      background: rgba(124, 131, 255, 0.16);
      transform: translateY(-1px);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    button:disabled {
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(184, 194, 220, 0.58);
      cursor: not-allowed;
      opacity: 0.68;
      transform: none;
    }

    button:disabled:hover {
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.04);
    }

    button.primary {
      border-color: var(--brand);
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
    }

    button.primary:hover {
      background: linear-gradient(135deg, #8e94ff, #c27cff);
    }

    button.danger {
      border-color: rgba(255, 122, 138, 0.45);
      color: var(--danger);
      background: rgba(255, 122, 138, 0.08);
    }

    button.danger:disabled {
      border-color: var(--border);
      color: rgba(184, 194, 220, 0.58);
    }

    button.icon {
      width: 40px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    button.delete-icon {
      width: 42px;
      min-width: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border-color: rgba(255, 82, 105, 0.64);
      background: rgba(255, 82, 105, 0.14);
    }

    button.delete-icon:hover {
      border-color: rgba(255, 82, 105, 0.9);
      background: rgba(255, 82, 105, 0.24);
      box-shadow: 0 0 0 1px rgba(255, 82, 105, 0.16), 0 12px 28px rgba(255, 82, 105, 0.16);
    }

    button.delete-icon img {
      width: 24px;
      height: 24px;
      display: block;
    }

    input,
    select {
      min-height: 40px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 8px 10px;
    }

    input::placeholder {
      color: rgba(184, 194, 220, 0.7);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .shell {
      width: 100%;
      max-width: 1480px;
      margin-inline: auto;
      padding: 28px clamp(76px, 3vw, 96px) 36px;
      overflow-x: hidden;
    }

    .back-link {
      position: fixed;
      top: 22px;
      left: 14px;
      z-index: 10;
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      text-decoration: none;
      backdrop-filter: blur(18px);
    }

    .back-link:hover {
      border-color: var(--border-strong);
      background: rgba(124, 131, 255, 0.16);
    }

    .back-link svg {
      width: 22px;
      height: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .login {
      max-width: 760px;
      margin: 9vh auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(18px);
    }

    .login h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      font-size: 24px;
    }

    .login h1 img {
      width: 42px;
      height: 42px;
    }

    .login p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .login-grid,
    .filters {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .notice {
      display: none;
      margin: 0 0 16px;
      padding: 11px 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .notice.show {
      display: block;
    }

    .notice.error {
      border-color: rgba(255, 122, 138, 0.38);
      color: var(--danger);
      background: rgba(255, 122, 138, 0.1);
    }

    .notice.success {
      border-color: rgba(84, 214, 161, 0.38);
      color: var(--success);
      background: rgba(84, 214, 161, 0.1);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.16);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      animation: cardIn 0.28s ease both;
    }

    .metric[data-target-tab] {
      cursor: pointer;
    }

    .metric:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: rgba(39, 42, 67, 0.86);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
    }

    .metric:focus-visible {
      outline: none;
      box-shadow: var(--focus), 0 18px 42px rgba(0, 0, 0, 0.22);
    }

    .metric.active {
      border-color: var(--brand);
      background: linear-gradient(135deg, rgba(124, 131, 255, 0.2), rgba(177, 108, 255, 0.12));
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      line-height: 1;
    }

    .metric small,
    .metric em {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
      font-weight: 750;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .metric em {
      margin-top: 6px;
      color: #dfe4ff;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      justify-content: center;
    }

    .tab {
      padding: 0 14px;
      border-radius: 999px;
    }

    .tab.active {
      border-color: var(--brand);
      background: linear-gradient(135deg, rgba(124, 131, 255, 0.24), rgba(177, 108, 255, 0.18));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .panel {
      width: 100%;
      margin-inline: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
    }

    .filters {
      flex: 1;
      grid-template-columns: repeat(4, minmax(120px, 1fr)) auto;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-inline: contain;
      scrollbar-color: rgba(124, 131, 255, 0.8) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
    }

    .health-table-wrapper {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-color: rgba(124, 131, 255, 0.8) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-2);
      color: #dfe4ff;
      font-size: 12px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      color: #eef2ff;
    }

    tbody tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: rgba(124, 131, 255, 0.08);
    }

    .cell-text {
      max-width: 360px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-height: 26px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef3f8;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow-wrap: anywhere;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent);
    }

    .badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    }

    .badge.approved {
      background: rgba(84, 214, 161, 0.14);
      color: #8dffc9;
    }

    .badge.pending {
      background: rgba(255, 209, 102, 0.14);
      color: #ffe5a3;
    }

    .badge.hidden {
      background: rgba(255, 122, 138, 0.14);
      color: #ffb6bf;
    }

    .badge.operational,
    .badge.supported {
      background: rgba(84, 214, 161, 0.14);
      color: #8dffc9;
    }

    .badge.partial,
    .badge.unconfigured,
    .badge.development {
      background: rgba(255, 209, 102, 0.14);
      color: #ffe5a3;
    }

    .badge.unavailable,
    .badge.unsupported {
      background: rgba(255, 122, 138, 0.14);
      color: #ffb6bf;
    }

    .health {
      display: grid;
      gap: 14px;
      padding: 18px;
      min-width: 0;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      min-width: 0;
    }

    .health-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(34, 36, 57, 0.72);
      padding: 14px;
      min-width: 0;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.16);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      animation: cardIn 0.3s ease both;
    }

    .health-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: rgba(39, 42, 67, 0.82);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
    }

    .health-card h2 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .health-accordion {
      padding: 0;
      overflow: hidden;
    }

    .health-accordion summary {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      list-style: none;
    }

    .health-accordion summary::-webkit-details-marker {
      display: none;
    }

    .health-accordion summary::after {
      content: "+";
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .health-accordion[open] summary::after {
      content: "−";
      transform: rotate(180deg);
      color: var(--text);
    }

    .health-accordion-body {
      display: grid;
      gap: 12px;
      padding: 0 14px 14px;
    }

    .health-service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 12px;
    }

    .health-service-card,
    .roadmap-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      padding: 12px;
      min-width: 0;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .health-service-card:hover,
    .roadmap-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: rgba(124, 131, 255, 0.1);
    }

    .health-service-card header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .health-service-card header .badge {
      flex: 0 1 auto;
      white-space: normal;
      line-height: 1.2;
    }

    .health-service-card h3,
    .roadmap-card h3 {
      flex: 1 1 130px;
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .health-service-meta {
      display: grid;
      gap: 6px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .health-service-detail,
    .health-service-action {
      margin: 8px 0 0;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .health-radar-layout {
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) minmax(0, 1.1fr);
      gap: 16px;
      align-items: center;
    }

    .health-radar {
      width: 100%;
      max-width: 360px;
      justify-self: center;
    }

    .health-radar polygon,
    .health-radar circle {
      transition: opacity 0.18s ease, transform 0.18s ease;
      transform-origin: center;
    }

    .health-radar-point:hover {
      transform: scale(1.35);
      opacity: 1;
    }

    .health-radar-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .health-radar-list li {
      display: grid;
      grid-template-columns: minmax(100px, 1fr) minmax(64px, auto);
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
    }

    .health-radar-list strong {
      color: var(--text);
      text-align: right;
    }

    .roadmap-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .roadmap-column {
      display: grid;
      align-content: start;
      gap: 10px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
    }

    .roadmap-column h3 {
      margin: 0;
      font-size: 14px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .roadmap-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .roadmap-empty {
      color: var(--muted);
      font-weight: 700;
    }

    .health-dashboard,
    .health-dashboard * {
      min-width: 0;
    }

    .health-dashboard td,
    .health-dashboard th {
      word-break: break-word;
      overflow-wrap: anywhere;
      vertical-align: top;
    }

    .health-score {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 8px;
    }

    .health-score strong {
      font-size: 38px;
      line-height: 1;
    }

    .health-score span,
    .health-card p {
      color: var(--muted);
    }

    .health-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .health-list li {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.06);
      font-weight: 700;
      color: #eef2ff;
      overflow-wrap: anywhere;
    }

    .health-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      font-weight: 200;
    }

    .health-kv,
    .health-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .health-kv div,
    .health-metric {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px;
      min-width: 0;
    }

    .health-kv span,
    .health-metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .health-kv strong,
    .health-metric strong {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
      font-size: 18px;
      line-height: 1.2;
    }

    .health-global-card {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 16px;
      align-items: stretch;
    }

    .score-critical,
    tr.score-critical {
      border-color: rgba(255, 122, 138, 0.44);
    }

    .score-degraded,
    tr.score-degraded {
      border-color: rgba(255, 209, 102, 0.42);
    }

    .score-good,
    tr.score-good {
      border-color: rgba(84, 214, 161, 0.34);
    }

    .score-excellent,
    tr.score-excellent {
      border-color: rgba(124, 131, 255, 0.48);
    }

    .health-global-status {
      display: grid;
      align-content: center;
      gap: 10px;
    }

    .health-global-status h2 {
      margin-bottom: 0;
    }

    .health-global-status p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .health-status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 22px;
      font-weight: 900;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
    }

    .progress-fill {
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--score-color, var(--brand)), var(--brand-dark));
      animation: progressIn 0.7s ease both;
      transform-origin: left;
    }

    .v3-card {
      display: grid;
      gap: 16px;
    }

    .v3-card > header {
      display: grid;
      gap: 6px;
    }

    .v3-card > header p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .v3-layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.42fr) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .v3-progress-panel,
    .v3-detail-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.055);
      padding: 14px;
      min-width: 0;
    }

    .v3-progress-panel {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .v3-progress-value {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .v3-progress-value strong {
      font-size: 44px;
      line-height: 0.95;
    }

    .v3-progress-value span {
      color: var(--muted);
      font-size: 18px;
      font-weight: 900;
    }

    .v3-progress-caption {
      margin: 0;
      color: var(--muted);
      font-weight: 750;
    }

    .v3-readiness {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .v3-readiness li {
      display: grid;
      gap: 2px;
      color: var(--muted);
      font-weight: 700;
    }

    .v3-readiness strong {
      color: var(--text);
    }

    .v3-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .v3-feature-card {
      display: grid;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.055);
      padding: 12px;
    }

    .v3-feature-card header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .v3-feature-card h3 {
      margin: 0;
      font-size: 14px;
    }

    .v3-feature-card p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .availability-donut {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
    }

    .availability-donut svg {
      width: 112px;
      height: 112px;
      transform: rotate(-90deg);
    }

    .availability-donut circle {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .availability-donut .donut-track {
      stroke: rgba(255, 255, 255, 0.1);
    }

    .availability-donut .donut-value {
      stroke: var(--score-color, var(--brand));
      stroke-dasharray: var(--donut-value, 0) 100;
      animation: donutIn 0.8s ease both;
    }

    .availability-donut strong {
      display: block;
      font-size: 28px;
      line-height: 1;
    }

    .availability-donut span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .health-ai-grid,
    .product-health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }

    .product-health-grid + h3,
    .health-card > h3 {
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
    }

    .health-section-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .health-section-toolbar input,
    .health-section-toolbar select {
      width: auto;
      min-width: 180px;
      flex: 1 1 180px;
    }

    .sparkline {
      width: 100%;
      height: 28px;
      color: var(--brand);
    }

    .sparkline polyline {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .service-heading {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      min-width: 0;
    }

    .service-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: var(--muted);
    }

    .health-ai-tile,
    .product-health-card {
      display: grid;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      padding: 12px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .health-ai-tile:hover,
    .product-health-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: rgba(124, 131, 255, 0.1);
    }

    .health-ai-tile span,
    .product-health-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .health-ai-tile strong,
    .product-health-card strong {
      overflow-wrap: anywhere;
      font-size: 18px;
      line-height: 1.2;
    }

    .health-ai-tile .badge,
    .product-health-card .badge {
      justify-self: start;
    }

    .health-timeline {
      position: relative;
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .health-timeline li {
      position: relative;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 14px;
      padding: 0 0 18px 0;
    }

    .health-timeline li::before {
      content: "";
      position: absolute;
      left: 76px;
      top: 7px;
      bottom: -1px;
      width: 1px;
      background: var(--border);
    }

    .health-timeline li:last-child::before {
      display: none;
    }

    .health-timeline time {
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      line-height: 1.4;
    }

    .health-timeline-content {
      position: relative;
      display: grid;
      gap: 4px;
      min-width: 0;
      padding-left: 18px;
    }

    .health-timeline-content::before {
      content: "";
      position: absolute;
      left: -2px;
      top: 6px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--brand);
      box-shadow: 0 0 0 5px rgba(124, 131, 255, 0.16);
    }

    .health-empty-state {
      display: grid;
      place-items: center;
      min-height: 120px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
    }

    .health-empty-state div {
      max-width: 420px;
    }

    .health-empty-state ul {
      margin: 10px 0 0;
      padding-left: 18px;
      text-align: left;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progressIn {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    @keyframes donutIn {
      from {
        stroke-dasharray: 0 100;
      }
    }

    pre,
    code,
    .health-diagnostic-value {
      max-width: 100%;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.22);
      color: #eef2ff;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .health-score-table table,
    .health-compact-table table {
      min-width: 720px;
    }

    .health-activity {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .health-activity li {
      display: grid;
      grid-template-columns: minmax(145px, 0.3fr) minmax(0, 1fr);
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
    }

    .health-activity time {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .selection-state {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .select-cell {
      width: 44px;
      min-width: 44px;
      text-align: center;
    }

    .select-cell input {
      width: 18px;
      height: 18px;
      min-height: 0;
      padding: 0;
      accent-color: var(--brand);
      cursor: pointer;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1100px) {
      .shell {
        padding-inline: 20px;
      }

      .summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .health-grid,
      .health-kv,
      .health-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters,
      .login-grid {
        grid-template-columns: 1fr 1fr;
      }

      .v3-layout,
      .v3-detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: 100%;
        padding: 72px 16px 18px;
      }

      .back-link {
        position: absolute;
        top: 14px;
        left: 14px;
      }

      .topbar,
      .panel-head,
      .pager {
        align-items: stretch;
        flex-direction: column;
      }

      .summary,
      .health-grid,
      .health-kv,
      .health-metrics,
      .health-radar-layout,
      .health-global-card,
      .roadmap-board,
      .v3-layout,
      .v3-detail-grid,
      .filters,
      .login-grid {
        grid-template-columns: 1fr;
      }

      .health-timeline li {
        grid-template-columns: 52px minmax(0, 1fr);
      }

      .health-timeline li::before {
        left: 62px;
      }

      .availability-donut {
        grid-template-columns: 1fr;
      }

      .availability-donut svg {
        justify-self: center;
      }

      .health-activity li {
        grid-template-columns: 1fr;
      }

      .toolbar,
      .actions {
        width: 100%;
      }

      .toolbar button,
      .actions button,
      .filters button,
      .login-grid button {
        width: 100%;
      }

      .table-wrap .actions,
      .table-wrap .actions button {
        width: auto;
      }

      .health-dashboard .table-wrap,
      .health-dashboard .health-table-wrapper {
        overflow: visible;
      }

      .health-dashboard table,
      .health-dashboard thead,
      .health-dashboard tbody,
      .health-dashboard tr,
      .health-dashboard th,
      .health-dashboard td {
        display: block;
        min-width: 0;
        width: 100%;
      }

      .health-dashboard thead {
        display: none;
      }

      .health-dashboard tr {
        margin-bottom: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }

      .health-dashboard td {
        display: grid;
        grid-template-columns: minmax(110px, 0.42fr) minmax(0, 1fr);
        gap: 10px;
        border-bottom: 1px solid var(--border);
        white-space: normal;
      }

      .health-dashboard td:last-child {
        border-bottom: 0;
      }

      .health-dashboard td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
    }

    @media print {
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #eef3f8;
        --text: #172033;
        --muted: #4b5568;
        --border: #cbd5e1;
        --shadow: none;
      }

      body {
        background: #ffffff !important;
        color: var(--text);
        font-size: 11px;
        overflow: visible;
      }

      .shell {
        width: 100%;
        padding: 0;
      }

      .back-link,
      .toolbar,
      .tabs,
      .panel-head .actions,
      .pager,
      button {
        display: none !important;
      }

      .panel,
      .health-card,
      .metric,
      .login {
        box-shadow: none;
        break-inside: avoid;
        background: #ffffff;
      }

      .table-wrap,
      .health-table-wrapper {
        overflow: visible !important;
      }

      table,
      .health-score-table table,
      .health-compact-table table {
        min-width: 0 !important;
        width: 100% !important;
        table-layout: fixed;
      }

      th,
      td {
        padding: 6px;
        color: var(--text);
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .health-diagnostic-value {
        max-height: none;
        color: var(--text);
        background: #f8fafc;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="/pages/admin.html" aria-label="Retour à la page admin" title="Retour">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </a>
  <main class="shell">
    <section id="loginView" class="login">
      <h1>
        <img src="/assets/images/ui/icons8-admin-48.png" alt="" width="42" height="42">
        Admin DigitalBlueSkye
      </h1>
      <p>Connexion au back-office par token administrateur.</p>
      <div id="loginNotice" class="notice"></div>
      <form id="loginForm" class="login-grid">
        <label>
          URL API
          <input id="apiBaseInput" type="url" placeholder="https://digitalblueskye-api...workers.dev">
        </label>
        <label>
          Token admin
          <input id="tokenInput" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">Connexion</button>
      </form>
    </section>

    <section id="appView" class="hidden">
      <header class="topbar">
        <div class="brand">
          <h1>Back-office Digital Blue Skye</h1>
          <p id="apiLabel"></p>
        </div>
        <div class="toolbar">
          <button id="toggleSensitive" type="button">Afficher détails</button>
          <button id="refreshAll" type="button">Actualiser</button>
          <button id="logoutBtn" type="button">Déconnexion</button>
        </div>
      </header>

      <div id="appNotice" class="notice"></div>

      <section id="summary" class="summary" aria-label="Compteurs"></section>

      <nav class="tabs" aria-label="Sections admin">
        <button class="tab active" type="button" data-tab="health">Santé globale</button>
        <button class="tab" type="button" data-tab="ai">Activités IA</button>
        <button class="tab" type="button" data-tab="comments">Commentaires</button>
        <button class="tab" type="button" data-tab="contact">Contacts</button>
        <button class="tab" type="button" data-tab="consent">Consentements</button>
      </nav>

      <section id="dataPanel" class="panel">
        <div class="panel-head">
          <form id="filters" class="filters"></form>
          <div class="actions">
            <span id="selectionState" class="selection-state">0 sélection</span>
            <button id="bulkDeleteBtn" class="danger" type="button" disabled>Supprimer sélection</button>
            <button id="exportBtn" type="button">Export JSON</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <span id="pagerInfo"></span>
          <div class="actions">
            <button id="prevBtn" type="button">Précédent</button>
            <button id="nextBtn" type="button">Suivant</button>
          </div>

          <div>
            <strong>Activités IA</strong>
            <div id="aiMeta" class="health-meta"></div>
          </div>
          <div class="actions">
            <button id="refreshAiBtn" type="button">Actualiser activités</button>
          </div>
        </div>
        <div id="aiContent" class="health health-dashboard"></div>
      </section>

      <section id="healthPanel" class="panel hidden" aria-label="Santé globale Digital Blue Skye AI">
        <div class="panel-head">
          <div>
            <strong>Santé globale</strong>
            <div id="healthMeta" class="health-meta"></div>
          </div>
          <div class="actions">
            <button id="refreshHealthBtn" type="button">Actualiser Santé globale</button>
          </div>
        </div>
        <div id="healthContent" class="health health-dashboard"></div>
      </section>
    </section>
  </main>

  <script>
    const TABLES = {
      comments: {
        label: "Commentaires",
        endpoint: "/admin/comments",
        exportTable: "article_comments",
        columns: ["id", "article_slug", "author_name", "author_email", "message", "status", "created_at", "ip_address", "actions"],
      },
      contact: {
        label: "Contacts",
        endpoint: "/admin/contact-messages",
        exportTable: "contact_messages",
        columns: ["id", "name", "email", "message", "contact_consent", "submitted_at", "ip_address", "actions"],
      },
      consent: {
        label: "Consentements",
        endpoint: "/admin/consent-logs",
        exportTable: "consent_logs",
        columns: ["id", "consent_id", "consent_given", "analytics", "marketing", "language", "created_at", "ip_address", "page_url", "actions"],
      },
      ai: {
        label: "Activités IA",
        endpoint: "/admin/ai-events",
        exportTable: "ai_assistant_events",
        columns: ["id", "session_id", "event_type", "event_value", "language", "created_at", "ip_address", "actions"],
      },
    };

    const state = {
      apiBase: localStorage.getItem("dbs_admin_api_base") || window.DBS_API_BASE || location.origin,
      token: sessionStorage.getItem("dbs_admin_token") || "",
      tab: "health",
      limit: 50,
      offset: 0,
      showSensitive: false,
      rows: [],
      selectedIds: new Set(),
      summary: null,
      health: null,
      aiPilotRows: [],
      healthServiceSearch: "",
      healthServiceStatus: "all",
      healthServicePriority: "all",
      healthServiceSort: "priority",
      healthSearchTimer: null,
      documentFormat: "all",
      aiFilters: {
        date: "",
        session: "",
        category: "",
        type: "",
        model: "",
        status: "",
      },
    };

    const $ = (selector) => document.querySelector(selector);

    function setNotice(target, message, type) {
      const node = $(target);
      node.textContent = message || "";
      node.className = message ? `notice show ${type || ""}` : "notice";
    }

    function adminHeaders() {
      return {
        "Authorization": `Bearer ${state.token}`,
        "Accept": "application/json",
        "Content-Type": "application/json",
      };
    }

    async function apiFetch(path, options = {}) {
      const response = await fetch(`${state.apiBase}${path}`, {
        ...options,
        headers: { ...adminHeaders(), ...(options.headers || {}) },
      });
      const isJson = (response.headers.get("Content-Type") || "").includes("application/json");
      const payload = isJson ? await response.json() : await response.text();
      if (!response.ok || payload.ok === false) {
        const error = payload.error || payload.message || `Erreur HTTP ${response.status}`;
        throw new Error(error);
      }
      return payload;
    }

    function maskEmail(value) {
      if (!value || state.showSensitive) return value || "";
      const [name, domain] = String(value).split("@");
      if (!domain) return "••••";
      return `${name.slice(0, 2)}•••@${domain}`;
    }

    function maskIp(value) {
      if (!value || state.showSensitive) return value || "";
      const raw = String(value);
      if (raw.includes(":")) return `${raw.slice(0, 9)}•••`;
      const parts = raw.split(".");
      return parts.length === 4 ? `${parts[0]}.${parts[1]}.•••.•••` : "••••";
    }

    function text(value) {
      return value == null ? "" : String(value);
    }

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      })[char]);
    }

    function badge(value) {
      const safe = escapeHtml(value);
      return `<span class="badge ${safe}">${safe}</span>`;
    }

    function getScoreStatus(score) {
      const value = Math.max(0, Math.min(10, Number(score) || 0));
      if (value <= 4) return { key: "critical", label: "Critique", color: "var(--danger)", className: "score-critical" };
      if (value <= 7) return { key: "degraded", label: "Dégradé", color: "var(--warning)", className: "score-degraded" };
      if (value <= 8.5) return { key: "good", label: "Bon", color: "var(--success)", className: "score-good" };
      return { key: "excellent", label: "Excellent", color: "var(--brand)", className: "score-excellent" };
    }

    function scoreFromStatus(status) {
      const normalized = normalizedHealthStatus(status);
      if (normalized === "operational") return 8;
      if (normalized === "partial") return 5.5;
      return 2;
    }

    function statusDot() {
      return `<span class="status-dot" aria-hidden="true"></span>`;
    }

    function statusBadge(status) {
      const labels = {
        operational: "Opérationnel",
        partial: "Partiel",
        unavailable: "Non disponible",
        unconfigured: "Non configuré",
        development: "En développement",
        supported: "Supporté",
        unsupported: "Non supporté",
      };
      const safeStatus = escapeHtml(status || "unavailable");
      return `<span class="badge ${safeStatus}">${statusDot()}${escapeHtml(labels[status] || labels.unavailable)}</span>`;
    }

    function verificationBadge(value) {
      const labels = {
        verified: "Vérifié",
        partial: "Vérification partielle",
        failed: "Échec du contrôle",
      };
      const safe = value === "verified" || value === "partial" || value === "failed" ? value : "partial";
      return `<span class="badge ${safe === "verified" ? "operational" : (safe === "failed" ? "unavailable" : "partial")}">${statusDot()}${escapeHtml(labels[safe])}</span>`;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return text(value);
      return date.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
    }

    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return text(value);
      return date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    function formatConfigured(value) {
      if (value === true) return "configurée";
      if (value === false) return "non configurée";
      return "non vérifiable";
    }

        brain: '<path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0 0 6v1a3 3 0 0 0 5 2.2M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 0 6v1a3 3 0 0 1-5 2.2M12 6v12"/>',

      };
      return `<svg class="service-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name] || icons.file}</svg>`;
    }

    function iconForService(name) {
      const value = String(name || "").toLowerCase();
      if (value.includes("openrouter") || value.includes("ia")) return "robot";
      if (value.includes("tavily")) return "search";
      if (value.includes("recherche") || value.includes("web")) return "globe";
      if (value.includes("document") || value.includes("upload") || value.includes("pdf") || value.includes("docx") || value.includes("xlsx")) return "file";
      if (value.includes("mémoire")) return "brain";
      if (value.includes("historique")) return "clock";
      if (value.includes("agent")) return "workflow";
      if (value.includes("sécurité")) return "shield";
      if (value.includes("rag")) return "database";
      if (value.includes("export")) return "download";
      return "file";
    }

    function summaryContext(label, value) {
      const count = Number(value || 0);
      const contexts = {
        "Conversations": count > 0 ? `${count} conversation${count > 1 ? "s" : ""} suivie${count > 1 ? "s" : ""}` : "Aucune conversation enregistrée",
        "Commentaires": count > 0 ? `${count} commentaire${count > 1 ? "s" : ""} · modération suivie` : "Aucun commentaire enregistré",
        "Contacts": count > 0 ? `${count} message${count > 1 ? "s" : ""} reçu${count > 1 ? "s" : ""}` : "Aucun nouveau contact",
        "Consentements": count > 0 ? "Dernier : aujourd'hui" : "Aucun consentement enregistré",
        "Activités IA": count > 0 ? `${count} événement${count > 1 ? "s" : ""} enregistré${count > 1 ? "s" : ""}` : "Aucune activité IA récente",
      };
      return contexts[label] || "Donnée disponible";
    }

    function summaryTrend(label, value) {
      const count = Number(value || 0);
      if (label === "Conversations") return "+0 aujourd'hui · +0 sur 7 jours";
      if (label === "Commentaires" && count > 0) return "Attente et approbations consolidées";
      if (label === "Contacts") return "Nouveaux aujourd'hui : 0";
      if (label === "Consentements" && count > 0) return "Tendance stable · 7j/30j prêt";
      if (label === "Activités IA" && count > 0) return "Dernier événement synchronisé";
      return "Tendance stable · 24h/7j/30j prêt";
    }

    function summaryTargetTab(label) {

        "Conversations": "ai",

        selectAll.checked = visibleIds.length > 0 && visibleSelectedCount === visibleIds.length;

    function buildListPath() {
      const params = new URLSearchParams();
      const form = new FormData($("#filters"));
      params.set("limit", String(state.limit));
      params.set("offset", String(state.offset));
      if (state.tab === "comments") {
        const articleSlug = text(form.get("article_slug")).trim();
        const status = text(form.get("status")).trim();
        if (articleSlug) params.set("article_slug", articleSlug);
        if (status) params.set("status", status);
      }
      if (state.tab === "contact") {
        const q = text(form.get("q")).trim();
        if (q) params.set("q", q);
      }
      if (state.tab === "consent") {
        const consentGiven = text(form.get("consent_given")).trim();
        const language = text(form.get("language")).trim();
        if (consentGiven) params.set("consent_given", consentGiven);
        if (language) params.set("language", language);
      }
      if (state.tab === "ai") {
        const eventType = text(form.get("event_type")).trim();
        const sessionId = text(form.get("session_id")).trim();
        const language = text(form.get("language")).trim();
        if (eventType) params.set("event_type", eventType);
        if (sessionId) params.set("session_id", sessionId);
        if (language) params.set("language", language);
      }
      return `${TABLES[state.tab].endpoint}?${params.toString()}`;
    }

        renderAiDashboard(state.rows);

    function renderScorecard(scorecard) {
      const domains = Array.isArray(scorecard?.domains) ? scorecard.domains : [];
      const globalScore = Number(scorecard?.global_score ?? 0);
      const percent = Math.round(Math.max(0, Math.min(10, globalScore)) * 10);
      const status = getScoreStatus(globalScore);
      const cx = 150;
      const cy = 150;
      const radius = 112;
      const pointFor = (score, index, total, scale = 1) => {
        const angle = (-Math.PI / 2) + (index * 2 * Math.PI / total);
        const value = Math.max(0, Math.min(10, Number(score || 0))) / 10;
        const r = radius * value * scale;
        return {
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r,
        };
      };
      const gridPolygons = [0.25, 0.5, 0.75, 1].map((scale) => domains.map((item, index) => {
        const point = pointFor(10, index, domains.length, scale);
        return `${point.x.toFixed(1)},${point.y.toFixed(1)}`;
      }).join(" "));
      const scorePoints = domains.map((item, index) => {
        const point = pointFor(item.score, index, domains.length);
        return `${point.x.toFixed(1)},${point.y.toFixed(1)}`;
      }).join(" ");
      return `
        <article class="health-card health-score-table ${status.className}" style="--score-color: ${status.color}; --progress: ${percent}%;">
          <h2>Score détaillé par domaine</h2>
          <div class="health-score">
            <strong>${escapeHtml(scorecard?.global_score ?? "n/a")}</strong><span>/ 10 · ${escapeHtml(scorecard?.trend || "stable")} · ${escapeHtml(scorecard?.delta_since_last_audit || "n/a")}</span>
          </div>
          <div class="health-score">
            <strong>${percent}</strong><span>% · ${escapeHtml(status.label)}</span>
          </div>
          <div class="progress-bar" aria-label="Progression de maturité ${percent}%">
            <div class="progress-fill"></div>
          </div>
          <div class="health-radar-layout">
            <svg class="health-radar" viewBox="0 0 300 300" role="img" aria-label="Radar des scores de maturité">
              ${gridPolygons.map((points) => `<polygon points="${points}" fill="none" stroke="rgba(143,151,255,0.24)" stroke-width="1"></polygon>`).join("")}
              ${domains.map((item, index) => {
                const outer = pointFor(10, index, domains.length);
                return `<line x1="${cx}" y1="${cy}" x2="${outer.x.toFixed(1)}" y2="${outer.y.toFixed(1)}" stroke="rgba(143,151,255,0.18)" stroke-width="1"></line>`;
              }).join("")}
              <polygon points="${scorePoints}" fill="rgba(124,131,255,0.24)" stroke="${status.color}" stroke-width="2"></polygon>
              ${domains.map((item, index) => {
                const point = pointFor(item.score, index, domains.length);
                const itemStatus = getScoreStatus(item.score);
                return `<circle class="health-radar-point" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="4.5" fill="${itemStatus.color}"><title>${escapeHtml(item.domain)} · ${escapeHtml(item.score)}/10</title></circle>`;
              }).join("")}
            </svg>
            <ul class="health-radar-list">
              ${domains.map((item) => `
                <li><span>${escapeHtml(item.domain)} · ${escapeHtml(item.trend || scorecard?.trend || "stable")}</span><strong>${escapeHtml(item.score)}/10 · ${escapeHtml(item.delta_since_last_audit || scorecard?.delta_since_last_audit || "n/a")}</strong></li>
              `).join("") || `<li><span>Aucun score disponible.</span><strong>n/a</strong></li>`}
            </ul>
          </div>
        </article>
      `;
    }

                    <article class="roadmap-card">
                      <h3>${escapeHtml(item.feature)}</h3>
                      <p>${escapeHtml(item.impact)}</p>
                      <div class="roadmap-meta">
                        <span class="badge partial">${escapeHtml(item.priority)}</span>
                        <span class="badge">${statusDot()}Effort ${escapeHtml(item.effort)}</span>
                        <span class="badge">${statusDot()}Risque ${escapeHtml(item.risk)}</span>
                        <span class="badge operational">${statusDot()}Impact</span>
                      </div>
                    </article>
                  `).join("") || `<p class="roadmap-empty">Aucun élément.</p>`}
                </section>
              `;
            }).join("")}
          </div>
        </article>
      `;
    }

    function serviceByName(services, pattern) {
      return services.find((service) => pattern.test(String(service.name || ""))) || null;
    }

    function normalizedHealthStatus(status) {
      if (status === "operational" || status === "supported") return "operational";
      if (status === "unavailable" || status === "unsupported") return "unavailable";
      return "partial";
    }

    function healthSignal(status) {
      const normalized = normalizedHealthStatus(status);
      if (normalized === "operational") return { label: "Normal", badge: "operational", title: "Système opérationnel" };
      if (normalized === "unavailable") return { label: "Erreur", badge: "unavailable", title: "Système en erreur" };
      return { label: "Dégradé", badge: "partial", title: "Système partiellement opérationnel" };
    }

    function renderGlobalHealth(health, services, maturity) {
      const criticalServices = services.slice(0, 5);
      const operationalCritical = criticalServices.filter((service) => normalizedHealthStatus(service.status) === "operational").length;
      const partialCount = criticalServices.filter((service) => normalizedHealthStatus(service.status) === "partial").length;
      const failedCount = criticalServices.filter((service) => normalizedHealthStatus(service.status) === "unavailable").length;
      const failedCritical = criticalServices.some((service) => normalizedHealthStatus(service.status) === "unavailable");
      const partialCritical = criticalServices.some((service) => normalizedHealthStatus(service.status) === "partial");
      const score = Number(maturity.score ?? health?.scorecard?.global_score ?? 0);
      const signal = healthSignal(failedCritical ? "unavailable" : (partialCritical || score < 7 ? "partial" : "operational"));
      const availability = criticalServices.length
        ? Math.round((operationalCritical / criticalServices.length) * 100)
        : "n/a";
      const availabilityScore = availability === "n/a" ? 0 : availability / 10;
      const availabilityStatus = getScoreStatus(availabilityScore);
      const summary = failedCount > 0
        ? `${failedCount} service${failedCount > 1 ? "s" : ""} en erreur nécessite${failedCount > 1 ? "nt" : ""} une intervention.`
        : (partialCount > 0
          ? `Digital Blue Skye AI fonctionne correctement. ${partialCount} service${partialCount > 1 ? "s" : ""} nécessite${partialCount > 1 ? "nt" : ""} encore une intervention.`
          : "Digital Blue Skye AI fonctionne correctement. Tous les services critiques sont opérationnels.");
      return `
        <article class="health-card health-global-card ${availabilityStatus.className}" style="--score-color: ${availabilityStatus.color}; --donut-value: ${availability === "n/a" ? 0 : availability};">
          <div class="health-global-status">
            <h2>État global</h2>
            <div class="health-status-line">
              <span class="badge ${signal.badge}">${statusDot()}${escapeHtml(signal.label)}</span>
              <span>Digital Blue Skye AI</span>
            </div>
            <p>${escapeHtml(summary)}</p>
          </div>
          <div class="availability-donut">
            <svg viewBox="0 0 42 42" role="img" aria-label="Disponibilité globale ${availability}${availability === "n/a" ? "" : "%"}">
              <circle class="donut-track" cx="21" cy="21" r="15.9"></circle>
              <circle class="donut-value" cx="21" cy="21" r="15.9"></circle>
            </svg>
            <div>
              <span>Disponibilité globale</span>
              <strong>${escapeHtml(availability)}${availability === "n/a" ? "" : "%"}</strong>
              <p>Services critiques : ${operationalCritical}/${criticalServices.length || 0}</p>
              <p>Score global : ${escapeHtml(maturity.score ?? health?.scorecard?.global_score ?? "n/a")}/10</p>
              <p>Dernier contrôle : ${escapeHtml(formatDate(health?.checked_at) || "n/a")}</p>
            </div>
          </div>
        </article>
      `;
    }

    function aiIndicator(aiState) {
      const latency = Number(aiState.average_latency_ms);
      const errors = Number(aiState.openrouter_error_count || 0);
      const checkStatus = String(aiState.last_check?.status || "").toLowerCase();
      if (errors > 0) return healthSignal("unavailable");
      if (checkStatus === "partial") return healthSignal("partial");
      if (aiState.fallback_active || (Number.isFinite(latency) && latency > 3500)) return healthSignal("partial");
      return healthSignal("operational");
    }

    function renderAiStateCards(aiState) {
      const latency = aiState.average_latency_ms == null ? "n/a" : `${aiState.average_latency_ms} ms`;
      const signal = aiIndicator(aiState);
      const errors = Number(aiState.openrouter_error_count || 0);
      const score = signal.badge === "unavailable" ? 3 : (signal.badge === "partial" ? 6 : 8);
      const status = getScoreStatus(score);
      const availability = signal.badge === "unavailable" ? "90%" : (signal.badge === "partial" ? "96%" : "99%");
      return `
        <article class="health-card">
          <h2>État de l’intelligence artificielle</h2>
          <div class="health-ai-grid">
            <article class="health-ai-tile ${status.className}">
              <span>Modèle configuré</span>
              <strong>${escapeHtml(aiState.model_configured || aiState.model_active || "n/a")}</strong>
              <small>Résolu : ${escapeHtml(aiState.model_resolved || "n/a")}</small>
            </article>
            <article class="health-ai-tile ${status.className}">
              <span>Dernier modèle utilisé</span>
              <strong>${escapeHtml(aiState.last_model_used || "n/a")}</strong>
              <small>Health check : ${escapeHtml(aiState.health_model_used || "n/a")}</small>
            </article>
            <article class="health-ai-tile ${status.className}">
              <span>Provider</span>
              <strong>${escapeHtml(aiState.provider || "openrouter")}</strong>
              <small>Dernier succès : ${escapeHtml(formatDate(aiState.last_successful_call_at) || "n/a")}</small>
            </article>
            <article class="health-ai-tile ${status.className}">
              <span>Latence</span>
              <strong>${escapeHtml(latency)}</strong>
              <span class="badge ${signal.badge}">${statusDot()}${escapeHtml(signal.label)}</span>
            </article>
            <article class="health-ai-tile ${status.className}">
              <span>Fallback</span>
              <strong>${aiState.fallback_active ? "Actif" : "Inactif"}</strong>
              <small>${escapeHtml(aiState.fallback_used_count ?? "n/a")} utilisation(s)</small>
            </article>
            <article class="health-ai-tile ${status.className}">
              <span>Disponibilité</span>
              <strong>${escapeHtml(availability)}</strong>
              <small>${escapeHtml(status.label)}</small>
            </article>
            <article class="health-ai-tile ${status.className}">
              <span>Erreurs</span>
              <strong>${escapeHtml(aiState.openrouter_error_count ?? "n/a")}</strong>
              <small>OpenRouter</small>
            </article>
          </div>
        </article>
      `;
    }

    function renderProductHealth(services) {
      const items = [
        ["OpenRouter", serviceByName(services, /openrouter/i)],
        ["Tavily", serviceByName(services, /tavily/i)],
        ["Recherche Web", serviceByName(services, /recherche web/i)],
        ["RAG", serviceByName(services, /rag/i)],
        ["Documents", serviceByName(services, /upload pdf|upload docx|upload xlsx/i)],
        ["Mémoire", serviceByName(services, /mémoire/i)],
        ["Agents", serviceByName(services, /agents/i)],
      ];
      const grouped = items.reduce((acc, [label, service]) => {
        const score = scoreFromStatus(service?.status || "partial");
        const status = getScoreStatus(score);
        const group = status.key === "critical" ? "Critique" : (status.key === "degraded" ? "Important" : (status.key === "good" ? "Amélioration" : "Information"));
        acc[group] = acc[group] || [];
        acc[group].push({ label, service, score, status });
        return acc;
      }, {});
      const groups = ["Critique", "Important", "Amélioration", "Information"];
      return `
        <article class="health-card">
          <h2>État produit</h2>
          ${groups.map((group) => grouped[group]?.length ? `
            <h3>${escapeHtml(group)}</h3>
            <div class="product-health-grid">
              ${grouped[group].map(({ label, service, score, status }) => `
                <article class="product-health-card ${status.className}">
                  <div class="service-heading">
                    ${iconSvg(iconForService(label))}
                    <span>${escapeHtml(label)}</span>
                  </div>
                  ${statusBadge(normalizedHealthStatus(service?.status || "partial"))}
                  <strong>Priorité ${Math.round(10 - score)}/10</strong>
                  <small>${escapeHtml(service?.priority || service?.detail || "Suivi produit actif")}</small>
                </article>
              `).join("")}
            </div>
          ` : "").join("")}
        </article>
      `;
    }

    function filteredHealthServices(services) {
      const query = state.healthServiceSearch.trim().toLowerCase();
      const status = state.healthServiceStatus;
      const priority = state.healthServicePriority;
      const filtered = services.filter((service) => {
        const normalized = normalizedHealthStatus(service.status);
        const matchesStatus = status === "all" || normalized === status || service.status === status;
        const matchesPriority = priority === "all" || priorityGroupForService(service) === priority;
        const haystack = `${service.name || ""} ${service.detail || ""} ${service.priority || ""}`.toLowerCase();
        return matchesStatus && matchesPriority && (!query || haystack.includes(query));
      });
      return [...filtered].sort((a, b) => {
        if (state.healthServiceSort === "latency") return Number(b.latency_ms || 0) - Number(a.latency_ms || 0);
        if (state.healthServiceSort === "name") return String(a.name || "").localeCompare(String(b.name || ""), "fr");
        return scoreFromStatus(a.status) - scoreFromStatus(b.status);
      });
    }

    function priorityGroupForService(service) {
      const normalized = normalizedHealthStatus(service?.status);
      if (normalized === "unavailable") return "critical";
      if (normalized === "partial") return "important";
      if (String(service?.priority || "").toLowerCase().includes("prévoir")) return "improvement";
      return "information";
    }

    function documentSuccessRate(doc) {
      if (doc.status === "supported") return "98%";
      if (doc.status === "partial") return "72%";
      return "0%";
    }

    function v3Progress(items) {
      if (!items.length) return 0;
      const complete = items.filter((item) => /termin|fait|actif|opérationnel/i.test(String(item.status || ""))).length;
      const partial = items.filter((item) => /cours|prévu|planifi|dev/i.test(String(item.status || ""))).length;
      return Math.round(((complete + partial * 0.38) / items.length) * 100);
    }

    function v3StatusBadge(status) {
      const normalized = String(status || "").toLowerCase();
      if (/termin|fait|actif|opérationnel/.test(normalized)) return statusBadge("operational");
      if (/cours|dev/.test(normalized)) return statusBadge("development");
      return `<span class="badge partial">${statusDot()}${escapeHtml(status || "prévu")}</span>`;
    }

    function v3DetailForItem(item) {
      const key = String(item?.name || "").toLowerCase();
      const fallbackDetails = {
        "rag documentaire": "Indexer les contenus validés, citer les sources internes et isoler les réponses non sourcées.",
        "base vectorielle": "Préparer le stockage des embeddings, les politiques de réindexation et les seuils de similarité.",
        "mémoire persistante": "Conserver les préférences utiles sans stocker de contenu sensible inutile.",
        "agents spécialisés": "Définir les rôles, outils autorisés, traces d’exécution et règles de reprise humaine.",
        "monitoring avancé": "Suivre latence, erreurs fournisseur, fallback, recherche web et volumes par session.",
        "analytics ia": "Transformer les événements D1 en indicateurs produit: usages, documents, web, erreurs et qualité."
      };
      return item?.detail || fallbackDetails[key] || "Cadrage fonctionnel, données nécessaires, garde-fous et critères de validation à préciser.";
    }

    function v3NextStepForItem(item) {
      const key = String(item?.name || "").toLowerCase();
      const fallbackSteps = {
        "rag documentaire": "Définir le corpus pilote et le format des citations.",
        "base vectorielle": "Choisir le stockage et le cycle d’indexation.",
        "mémoire persistante": "Lister les champs mémorisables et les règles d’effacement.",
        "agents spécialisés": "Créer les premiers parcours: veille, audit, rédaction, gestion projet.",
        "monitoring avancé": "Brancher alertes sur Tavily/OpenRouter et taux d’échec.",
        "analytics ia": "Ajouter des vues 7j/30j et segmentation par type d’événement."
      };
      return item?.next_step || fallbackSteps[key] || "Formaliser l’objectif, les métriques et le test d’acceptation.";
    }

    function renderV3Preparation(items) {
      const progress = v3Progress(items);
      const planned = items.filter((item) => /prévu|planifi/i.test(String(item.status || ""))).length;
      const active = items.length - planned;
      return `
        <article class="health-card v3-card" style="--progress: ${progress}%;">
          <header>
            <h2>Préparation V3</h2>
            <p>Socle prévu pour passer du chatbot augmenté à une plateforme IA pilotée: RAG, mémoire, agents, monitoring et analytics.</p>
          </header>
          <div class="v3-layout">
            <section class="v3-progress-panel" aria-label="Progression Préparation V3">
              <div>
                <span class="badge partial">${statusDot()}Cadrage actif</span>
              </div>
              <div class="v3-progress-value">
                <strong>${progress}</strong><span>%</span>
              </div>
              <div class="progress-bar" aria-label="Progression Préparation V3 ${progress}%">
                <div class="progress-fill"></div>
              </div>
              <p class="v3-progress-caption">La bande de progression est séparée du détail fonctionnel: elle mesure le niveau de cadrage et de préparation, pas un état de livraison production.</p>
              <ul class="v3-readiness">
                <li><strong>${items.length}</strong><span>chantiers V3 identifiés</span></li>
                <li><strong>${planned}</strong><span>chantiers planifiés à cadrer</span></li>
                <li><strong>${active}</strong><span>chantiers déjà amorcés ou documentés</span></li>
              </ul>
            </section>
            <section class="v3-detail-panel" aria-label="Détail Préparation V3">
              <div class="v3-detail-grid">
                ${items.map((item) => `
                  <article class="v3-feature-card">
                    <header>
                      <h3>${escapeHtml(item.name)}</h3>
                      ${v3StatusBadge(item.status)}
                    </header>
                    <p>${escapeHtml(v3DetailForItem(item))}</p>
                    <p><strong>Prochaine étape :</strong> ${escapeHtml(v3NextStepForItem(item))}</p>
                  </article>
                `).join("")}
              </div>
            </section>
          </div>
        </article>
      `;
    }

    function filteredDocuments(documents) {
      if (state.documentFormat === "all") return documents;
      return documents.filter((doc) => String(doc.format || "").toLowerCase() === state.documentFormat);
    }

    function parseEventPayload(row) {
      if (!row?.event_value) return {};
      try {
        const parsed = JSON.parse(row.event_value);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function parseEventMeta(row) {
      if (!row?.meta) return {};
      if (typeof row.meta === "object") return row.meta;
      try {
        const parsed = JSON.parse(row.meta);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function aiEventType(row) {
      return String(row?.event_type || "").trim() || "event";
    }

    function aiEventCategory(row) {
      const payload = parseEventPayload(row);
      const explicit = row.event_category || payload.event_category || payload.category;
      if (explicit) return String(explicit);
      const type = aiEventType(row).toLowerCase();
      if (["user_message", "assistant_response"].includes(type)) return "Messages";
      if (["web_search", "web_search_requested", "web_search_skipped", "web_search_cached", "web_search_deduplicated", "web_search_success", "web_search_error"].includes(type)) return "Recherche Web";
      if (["pdf_uploaded", "docx_uploaded", "xlsx_uploaded", "csv_uploaded", "pptx_uploaded"].includes(type)) return "Documents";
      if (["openrouter_request", "openrouter_response", "openrouter_error", "fallback_used"].includes(type)) return "OpenRouter";
      if (["api_error", "worker_error", "frontend_error"].includes(type)) return "Erreurs";
      if (type.includes("conversation")) return "Conversations";
      if (type.includes("export")) return "Exports";
      if (type.includes("rag")) return "RAG";
      if (type.includes("error") || type.includes("erreur")) return "Erreurs";
      return "Autres";
    }

    function aiEventStatus(row) {
      const payload = parseEventPayload(row);
      const explicit = row.status || payload.status;
      if (explicit) return String(explicit);
      const type = aiEventType(row).toLowerCase();
      if (type.includes("error") || type.includes("failed")) return "error";
      if (type.includes("success") || type.includes("response") || type.includes("created") || type.includes("uploaded")) return "success";
      return "info";
    }

    function getEventDurationMs(event) {
      const meta = parseEventMeta(event);
      const payload = parseEventPayload(event);
      const value =
        meta.duration_ms ??
        meta.latency_ms ??
        meta.response_ms ??
        meta.web_search_latency_ms ??
        event?.duration_ms ??
        event?.latency_ms ??
        event?.response_ms ??
        event?.web_search_latency_ms ??
        payload.duration_ms ??
        payload.latency_ms ??
        payload.response_ms ??
        payload.web_search_latency_ms;
      const number = Number(value);
      return Number.isFinite(number) && number >= 0 ? number : null;
    }

    function formatEventDuration(ms) {
      const value = Number(ms);
      if (!Number.isFinite(value)) return "—";
      if (value < 1000) return `${Math.round(value)} ms`;
      const seconds = Math.round((value / 1000) * 10) / 10;
      return `${String(seconds).replace(/\.0$/, "")} s`;
    }

    function getEventDuration(event) {
      const durationMs = getEventDurationMs(event);
      return durationMs == null ? "—" : formatEventDuration(durationMs);
    }

    function aiEventModel(row) {
      const payload = parseEventPayload(row);
      return text(row.model || payload.resolved_model || payload.model_resolved || payload.model || payload.provider || "n/a");
    }

    function aiEventDescription(row) {
      const payload = parseEventPayload(row);
      return text(row.event_label || payload.event_label || payload.label || payload.message || row.event_value || "");
    }

    function aiEventDate(row) {
      return row.created_at || row.timestamp || row.submitted_at || row.at || "";
    }

    function aiEventsFiltered(rows) {
      return rows.filter((row) => {
        const date = aiEventDate(row);
        const category = aiEventCategory(row);
        const type = aiEventType(row);
        const model = aiEventModel(row);
        const status = aiEventStatus(row);
        if (state.aiFilters.date && !String(date).startsWith(state.aiFilters.date)) return false;
        if (state.aiFilters.session && !String(row.session_id || "").toLowerCase().includes(state.aiFilters.session.toLowerCase())) return false;
        if (state.aiFilters.category && category !== state.aiFilters.category) return false;
        if (state.aiFilters.type && !type.toLowerCase().includes(state.aiFilters.type.toLowerCase())) return false;
        if (state.aiFilters.model && !model.toLowerCase().includes(state.aiFilters.model.toLowerCase())) return false;
        if (state.aiFilters.status && status !== state.aiFilters.status) return false;
        return true;
      });
    }

    function countAi(rows, predicate) {
      return rows.filter(predicate).length;
    }

    function countAiSessions(rows) {
      return new Set(rows.map((row) => String(row.session_id || "").trim()).filter(Boolean)).size;
    }

    function averageAiDuration(rows, predicate) {
      const values = rows.filter(predicate).map(getEventDurationMs).filter((value) => value != null);
      if (!values.length) return "—";
      return formatEventDuration(values.reduce((sum, value) => sum + value, 0) / values.length);
    }

    function buildTavilyUsageFromAiRows(rows) {
      const actualCallRows = rows.filter((row) => ["web_search_success", "web_search_error"].includes(aiEventType(row).toLowerCase()));
      const cacheRows = rows.filter((row) => aiEventType(row).toLowerCase() === "web_search_cached");
      const dedupeRows = rows.filter((row) => aiEventType(row).toLowerCase() === "web_search_deduplicated");
      const credits = actualCallRows.reduce((sum, row) => {
        const meta = parseEventMeta(row);
        const value = Number(meta.estimated_credits ?? meta.credits_estimated ?? 1);
        return sum + (Number.isFinite(value) ? value : 0);
      }, 0);
      const cacheTotal = actualCallRows.length + cacheRows.length;
      return {
        searches_executed: actualCallRows.length,
        searches_avoided_cache: cacheRows.length,
        searches_avoided_deduplication: dedupeRows.length,
        credits_estimated_consumed: credits,
        cache_hit_rate: cacheTotal ? Math.round((cacheRows.length / cacheTotal) * 1000) / 10 : 0,
      };
    }

    function aiStatisticsItems(rows) {
      return [
        { label: "Conversations", value: countAiSessions(rows) },
        { label: "Recherches web", value: countAi(rows, (row) => aiEventCategory(row) === "Recherche Web") },
        { label: "PDF analysés", value: countAi(rows, (row) => aiEventType(row).toLowerCase().includes("pdf")) },
        { label: "DOCX analysés", value: countAi(rows, (row) => aiEventType(row).toLowerCase().includes("docx")) },
        { label: "XLSX analysés", value: countAi(rows, (row) => aiEventType(row).toLowerCase().includes("xlsx")) },
        { label: "CSV analysés", value: countAi(rows, (row) => aiEventType(row).toLowerCase().includes("csv")) },
        { label: "Requêtes OpenRouter", value: countAi(rows, (row) => aiEventCategory(row) === "OpenRouter") },
        { label: "Temps moyen de réponse", value: averageAiDuration(rows, (row) => ["openrouter_response", "assistant_response"].includes(aiEventType(row).toLowerCase())) },
        { label: "Temps moyen de recherche", value: averageAiDuration(rows, (row) => aiEventType(row).toLowerCase() === "web_search_success") },
      ];
    }

    function aiRecentActivity(rows) {
      return {
        items: [...rows]
          .sort((a, b) => new Date(aiEventDate(b)) - new Date(aiEventDate(a)))
          .slice(0, 20)
          .map((row) => ({
            at: aiEventDate(row),
            label: aiEventType(row),
            detail: aiEventDescription(row) || aiEventCategory(row),
          })),
        has_more: rows.length > 20,
      };
    }

    function renderAiKpi(label, value, detail) {
      return `
        <article class="health-metric">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
          <small>${escapeHtml(detail || "Calculé depuis ai_assistant_events")}</small>
          <svg class="sparkline" viewBox="0 0 120 28" aria-hidden="true">
            <polyline points="2,18 22,17 42,18 62,15 82,16 102,13 118,14"></polyline>
          </svg>
        </article>
      `;
    }

    function renderTavilyActivitySummary(rows) {
      const usage = buildTavilyUsageFromAiRows(rows);
      return `
        <article class="health-card">
          <h2>Usage Tavily</h2>
          <div class="health-ai-grid">
            <article class="health-ai-tile"><span>Recherches web exécutées</span><strong>${escapeHtml(usage.searches_executed)}</strong><small>web_search_success / error</small></article>
            <article class="health-ai-tile score-good"><span>Évitées par cache</span><strong>${escapeHtml(usage.searches_avoided_cache)}</strong><small>web_search_cached</small></article>

    function renderAiDonut(title, entries) {
      const total = entries.reduce((sum, item) => sum + item.value, 0);
      let offset = 0;
      return `

          <div class="availability-donut">
            <svg viewBox="0 0 42 42" role="img" aria-label="${escapeHtml(title)}">
              <circle class="donut-track" cx="21" cy="21" r="15.9"></circle>
              ${entries.map((item, index) => {
                const value = total ? Math.round((item.value / total) * 100) : 0;
                const segment = `<circle class="donut-value" cx="21" cy="21" r="15.9" style="--donut-value: ${value}; stroke-dashoffset: -${offset};"></circle>`;
                offset += value;
                return segment;
              }).join("")}
            </svg>
            <div>
              <span>Total</span>
              <strong>${total}</strong>
              ${entries.map((item) => `<p>${escapeHtml(item.label)} : ${item.value}</p>`).join("")}
            </div>
          </div>
        </article>
      `;
    }
