    function tavilyGaugeStatus(percent) {
      const value = Number(percent);
      if (!Number.isFinite(value)) return { key: "unknown", className: "score-neutral", label: "n/a", color: "#64748b", alert: "" };
      if (value >= 95) return { key: "critical", className: "score-critical", label: "Critique", color: "#7f1d1d", alert: "Critique : quota Tavily presque épuisé." };
      if (value >= 80) return { key: "red", className: "score-critical", label: "Rouge", color: "#dc2626", alert: "Alerte : consommation Tavily élevée." };
      if (value >= 60) return { key: "orange", className: "score-warning", label: "Orange", color: "#f97316", alert: "Attention : plus de 60 % du quota Tavily est consommé." };
      return { key: "green", className: "score-good", label: "Vert", color: "#16a34a", alert: "" };
    }

    function formatPercent(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toFixed(number % 1 ? 1 : 0)}%` : "n/a";
    }

    function formatMs(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${Math.round(number)} ms` : "n/a";
    }

    function renderTavilyConsumption(tavilyUsage = {}, configuration = {}) {
      const usedPercent = Number(tavilyUsage.quota_estimated_used_percent || 0);
      const status = tavilyGaugeStatus(usedPercent);

      const apiConfigured = tavilyUsage.api_key_configured ?? configuration.tavily_api_key_configured;
      return `
        <article class="health-card ${status.className}">
          <h2>Consommation Tavily</h2>
          ${status.alert ? `<p class="badge ${status.key === "orange" ? "partial" : "unavailable"}">${statusDot()}${escapeHtml(status.alert)}</p>` : ""}
          ${ultra ? `<p class="badge unavailable">${statusDot()}Mode ultra-économique actif</p>` : ""}
          <div class="health-global-status" style="--score-color: ${status.color};">
            <div class="progress-bar" aria-label="Quota Tavily consommé ${formatPercent(usedPercent)}">
              <div class="progress-fill" style="width: ${Math.min(100, Math.max(0, usedPercent))}%; background: ${status.color};"></div>
            </div>
            <p><strong>${escapeHtml(formatPercent(usedPercent))}</strong> du quota estimé consommé · niveau ${escapeHtml(status.label)}</p>
          </div>
          <div class="health-ai-grid">
            <article class="health-ai-tile ${status.className}"><span>Recherches exécutées</span><strong>${escapeHtml(tavilyUsage.searches_executed ?? 0)}</strong><small>Tavily réel</small></article>
            <article class="health-ai-tile score-good"><span>Évitées par cache</span><strong>${escapeHtml(tavilyUsage.searches_avoided_cache ?? 0)}</strong><small>cache_hit ${escapeHtml(formatPercent(tavilyUsage.cache_hit_rate || 0))}</small></article>
            <article class="health-ai-tile score-good"><span>Évitées par déduplication</span><strong>${escapeHtml(tavilyUsage.searches_avoided_deduplication ?? 0)}</strong><small>${escapeHtml(formatPercent(tavilyUsage.deduplication_rate || 0))}</small></article>
            <article class="health-ai-tile"><span>Cache miss</span><strong>${escapeHtml(formatPercent(tavilyUsage.cache_miss_rate || 0))}</strong><small>${escapeHtml(tavilyUsage.cache_miss_count ?? 0)} miss</small></article>
            <article class="health-ai-tile"><span>Latence moyenne</span><strong>${escapeHtml(formatMs(tavilyUsage.average_latency_ms))}</strong><small>Dernière : ${escapeHtml(formatMs(tavilyUsage.last_latency_ms))}</small></article>
            <article class="health-ai-tile ${status.className}"><span>Crédits estimés</span><strong>${escapeHtml(tavilyUsage.credits_estimated_consumed ?? 0)}</strong><small>Restants : ${escapeHtml(tavilyUsage.credits_estimated_remaining ?? "n/a")}</small></article>
            <article class="health-ai-tile"><span>Moyenne quotidienne</span><strong>${escapeHtml(tavilyUsage.daily_average ?? 0)}</strong><small>recherches/jour</small></article>
            <article class="health-ai-tile"><span>Moyenne hebdomadaire</span><strong>${escapeHtml(tavilyUsage.weekly_average ?? 0)}</strong><small>recherches/jour sur 7j</small></article>
          </div>
          <h3>Santé globale Tavily</h3>
          ${renderHealthKv([
            ["TAVILY_API_KEY configurée", formatConfigured(apiConfigured)],
            ["Endpoint utilisé", tavilyUsage.endpoint || "https://api.tavily.com/search"],
            ["Dernier appel", formatDate(tavilyUsage.last_call_at) || "n/a"],
            ["Dernière latence", formatMs(tavilyUsage.last_latency_ms)],
            ["Dernier succès", formatDate(tavilyUsage.last_success_at) || "n/a"],
            ["Dernier échec", formatDate(tavilyUsage.last_error_at) || "n/a"],
            ["Erreur récente", (() => {
              if (tavilyUsage.error_status === "resolved") {
                return `${tavilyUsage.last_error} (résolue — succès plus récent le ${formatDate(tavilyUsage.last_success_at)})`;
              }
              if (tavilyUsage.error_status === "active") {
                return tavilyUsage.last_error || "active";
              }

            })()],
            ["Quota estimé utilisé", `${tavilyUsage.credits_estimated_consumed ?? 0} / ${tavilyUsage.quota_estimated_total ?? "n/a"}${tavilyUsage.quota_source === "fallback_default" ? " (valeur par défaut non configurée)" : ""}`],

            ["Mode économique actif", tavilyUsage.economy_mode_active === false ? "non" : "oui"],
            ["Mode ultra-économique actif", ultra ? "oui" : "non"],

    function renderHealth(health) {
      const maturity = health?.maturity || {};
      const configuration = health?.configuration || {};
      const system = health?.system || {};
      const scorecard = health?.scorecard || {};
      const aiRows = Array.isArray(state.aiPilotRows) ? state.aiPilotRows : [];
      const statistics = {
        items: aiStatisticsItems(aiRows),
        note: "Statistiques calculées depuis ai_assistant_events.",
      };
      const recentActivity = aiRecentActivity(aiRows);
      const aiState = health?.ai_state || {};
      const tavilyUsage = health?.tavily_usage || {};
      const ragUsage = health?.rag_usage || {};
      const services = Array.isArray(health?.services) ? health.services : [];
      const priorities = Array.isArray(health?.next_priorities) ? health.next_priorities : [];
      const documents = Array.isArray(health?.documents) ? health.documents : [];
      const visibleServices = filteredHealthServices(services);
      const visibleDocuments = filteredDocuments(documents);
      const v3 = Array.isArray(health?.v3_placeholders) ? health.v3_placeholders : [];
        $("#healthMeta").innerHTML = `
        <span>Dernier contrôle: ${escapeHtml(formatDate(health?.checked_at) || "non disponible")}</span>
        ${health?.fallback ? `<span>Mode local: endpoint Santé globale non déployé</span>` : ""}
        <span>OPENROUTER_API_KEY: ${formatConfigured(configuration.openrouter_api_key_configured)}</span>
        <span>TAVILY_API_KEY: ${formatConfigured(configuration.tavily_api_key_configured)}</span>
        <span>Tavily ultra-éco: ${health?.tavily_usage?.ultra_economy_mode_active ? "actif" : "inactif"}</span>
        <span>Source secrets: ${escapeHtml(configuration.source || "digitalblueskye-ai")}</span>
      `;
      $("#healthContent").innerHTML = `
        ${renderGlobalHealth(health, services, maturity)}
        <article class="health-card">
          <h2>Versioning système</h2>
          ${renderHealthKv([
            ["Version", system.version || "1.5.0"],
            ["Build", system.build || health?.checked_at?.slice(0, 10)],
            ["Commit", system.commit || "n/a"],
            ["Dernier déploiement", formatDate(system.last_deployed_at) || formatDate(health?.checked_at)],
          ])}
        </article>
        ${renderHealthDiagnostics(health?.health_diagnostics)}
        <div class="health-grid">
          <article class="health-card">
            <h2>Maturité Digital Blue Skye AI</h2>
            <p class="health-score"><strong>${escapeHtml(maturity.score ?? "n/a")}</strong><span>/ ${escapeHtml(maturity.max || 10)}</span></p>
            <p>${escapeHtml(maturity.detail || "")}</p>
          </article>
          <article class="health-card">
            <h2>Capacités actuelles</h2>

          </article>
        </div>
        ${renderScorecard(scorecard)}
        ${renderServiceCards(services)}
        ${renderProductHealth(services)}
        <article class="health-card">
          <h2>Statistiques</h2>
          ${renderHealthMetrics(statistics.items)}
          <p>${escapeHtml(statistics.note || "Métriques extensibles.")}</p>
        </article>
        ${renderAiStateCards(aiState)}
        ${renderTavilyConsumption(tavilyUsage, configuration)}
        ${renderRagPilotage(ragUsage)}
        <article class="health-card">
          <h2>Services</h2>
          <div class="health-section-toolbar" aria-label="Filtres services">
            <input id="healthServiceSearch" type="search" placeholder="Rechercher un service" value="${escapeHtml(state.healthServiceSearch)}">
            <select id="healthServiceStatus" aria-label="Filtrer par statut">
              <option value="all" ${state.healthServiceStatus === "all" ? "selected" : ""}>Tous les statuts</option>
              <option value="operational" ${state.healthServiceStatus === "operational" ? "selected" : ""}>Opérationnels</option>
              <option value="partial" ${state.healthServiceStatus === "partial" ? "selected" : ""}>Partiels</option>
              <option value="unavailable" ${state.healthServiceStatus === "unavailable" ? "selected" : ""}>En erreur</option>
            </select>
            <select id="healthServicePriority" aria-label="Filtrer par priorité">
              <option value="all" ${state.healthServicePriority === "all" ? "selected" : ""}>Toutes les priorités</option>
              <option value="critical" ${state.healthServicePriority === "critical" ? "selected" : ""}>Critique</option>
              <option value="important" ${state.healthServicePriority === "important" ? "selected" : ""}>Important</option>
              <option value="improvement" ${state.healthServicePriority === "improvement" ? "selected" : ""}>Amélioration</option>
              <option value="information" ${state.healthServicePriority === "information" ? "selected" : ""}>Information</option>

                    <td data-label="Contrôle">${verificationBadge(service.verification)}</td>
                    <td data-label="Détail"><div class="cell-text">${escapeHtml(service.detail)}</div></td>

                    <td data-label="Priorité d’amélioration"><div class="cell-text">${escapeHtml(service.priority)}</div></td>
                  </tr>
                `;
                }).join("") || `<tr><td colspan="6">Aucune donnée de santé globale.</td></tr>`}
              </tbody>
            </table>
          </div>
        </article>
        ${renderRecentActivity(recentActivity)}
        <article class="health-card health-compact-table">
          <h2>Documents</h2>
          <div class="health-section-toolbar" aria-label="Filtres documents">
            <select id="documentFormatFilter" aria-label="Filtrer par format">
              <option value="all" ${state.documentFormat === "all" ? "selected" : ""}>Tous les formats</option>
              ${documents.map((doc) => String(doc.format || "").toLowerCase()).filter((value, index, list) => value && list.indexOf(value) === index).map((format) => `
                <option value="${escapeHtml(format)}" ${state.documentFormat === format ? "selected" : ""}>${escapeHtml(format.toUpperCase())}</option>
              `).join("")}
            </select>
          </div>
          <div class="table-wrap health-table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Format</th>
                  <th>Support</th>
                  <th>Taille maximale testée</th>
                  <th>Dernière utilisation</th>
                  <th>Taux de succès</th>
                  <th>Fiabilité</th>
                </tr>
              </thead>
              <tbody>
                ${visibleDocuments.map((doc) => `
                  <tr>
                    <td data-label="Format"><strong>${escapeHtml(doc.format)}</strong></td>
                    <td data-label="Support">${statusBadge(doc.status === "partial" ? "partial" : (doc.status === "supported" ? "supported" : "unsupported"))}</td>
                    <td data-label="Taille maximale testée">${escapeHtml(doc.max_tested_size)}</td>
                    <td data-label="Dernière utilisation">${escapeHtml(formatDate(doc.last_validation))}</td>
                    <td data-label="Taux de succès">${escapeHtml(documentSuccessRate(doc))}</td>
                    <td data-label="Fiabilité">${statusBadge(String(doc.reliability || "").includes("élev") ? "operational" : (String(doc.reliability || "").includes("moy") ? "partial" : "unavailable"))} ${escapeHtml(doc.reliability)}</td>
                  </tr>
                `).join("") || `<tr><td colspan="6">Aucun suivi documentaire.</td></tr>`}
              </tbody>
            </table>
          </div>
        </article>
        <div class="health-grid">
          <article class="health-card">
            <h2>En développement</h2>
            ${renderHealthList(health?.in_development)}
          </article>
          <article class="health-card">
            <h2>Sécurité</h2>
            <p>Les secrets ne sont jamais affichés. Seule la présence des clés API est exposée en oui/non.</p>
          </article>
        </div>
        ${renderRoadmap(priorities)}
        ${renderV3Preparation(v3)}
      `;
    }

    async function loadHealth() {
      setNotice("#appNotice", "", "");
      try {
        const [payload, aiPayload] = await Promise.all([
          apiFetch("/admin/health"),
          apiFetch("/admin/ai-events?limit=200&offset=0").catch(() => ({ items: [] })),
        ]);
        state.aiPilotRows = aiPayload.items || [];
        if (state.summary) {
          state.summary.conversations_total = countAiSessions(state.aiPilotRows);
          state.summary.ai_assistant_events = state.aiPilotRows.length || state.summary.ai_assistant_events;
          renderSummary(state.summary);
        }
        state.health = payload;
        renderHealth(payload);
      } catch (error) {
        state.aiPilotRows = [];
        const fallback = buildFallbackHealth(error.message);
        state.health = fallback;
        renderHealth(fallback);
        setNotice("#appNotice", "Endpoint Santé globale non disponible sur le Worker API actuel. Affichage du diagnostic local.", "error");
      }
    }

    function setActiveTab(tabName) {
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === tabName));
      state.tab = tabName;
      state.offset = 0;
      state.selectedIds.clear();
      if (state.summary) renderSummary(state.summary);
      const isHealth = tabName === "health";
      const isAi = tabName === "ai";
      $("#dataPanel").classList.toggle("hidden", isHealth || isAi);
      $("#aiPanel").classList.toggle("hidden", !isAi);
      $("#healthPanel").classList.toggle("hidden", !isHealth);
      if (!isHealth && !isAi) renderFilters();
    }

    async function changeStatus(id, status) {
      await apiFetch("/admin/comments/status", {
        method: "POST",
        body: JSON.stringify({ id: Number(id), status }),
      });
      setNotice("#appNotice", "Statut du commentaire mis à jour.", "success");
      await refreshAll();
    }

    async function deleteRow(id) {
      if (!confirm(`Supprimer ${deleteLabelForTab()} ?`)) return;
      await apiFetch(deleteEndpointForTab(), {
        method: "POST",
        body: JSON.stringify({ id: Number(id) }),
      });
      await refreshAll();
      setNotice("#appNotice", "Suppression effectuée.", "success");
    }

    async function bulkDeleteSelectedRows() {
      const ids = Array.from(state.selectedIds)
        .map((id) => Number(id))
        .filter((id) => Number.isInteger(id) && id > 0);
      if (!ids.length) return;
      if (!confirm(`Supprimer ${deleteLabelForTab(ids.length)} (${ids.length} ligne${ids.length > 1 ? "s" : ""}) ?`)) return;
      await apiFetch(deleteEndpointForTab(), {
        method: "POST",
        body: JSON.stringify({ ids }),
      });
      await refreshAll();
      setNotice("#appNotice", `${ids.length} suppression${ids.length > 1 ? "s" : ""} effectuée${ids.length > 1 ? "s" : ""}.`, "success");
    }

    async function exportJson() {
      const table = TABLES[state.tab].exportTable;
      const response = await fetch(`${state.apiBase}/admin/export?table=${encodeURIComponent(table)}&format=json`, {
        headers: adminHeaders(),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.error || `Export impossible (${response.status})`);
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${table}.json`;
      link.click();
      URL.revokeObjectURL(url);
      setNotice("#appNotice", "Export JSON généré.", "success");
    }

    function showApp() {
      $("#loginView").classList.add("hidden");
      $("#appView").classList.remove("hidden");
      $("#apiLabel").textContent = state.apiBase;
      setActiveTab(state.tab);
    }

    function logout() {
      sessionStorage.removeItem("dbs_admin_token");
      state.token = "";
      $("#appView").classList.add("hidden");
      $("#loginView").classList.remove("hidden");
      $("#tokenInput").value = "";
    }

    $("#apiBaseInput").value = state.apiBase;
    $("#tokenInput").value = state.token;

    $("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      state.apiBase = $("#apiBaseInput").value.trim().replace(/\/$/, "") || location.origin;
      state.token = $("#tokenInput").value.trim();
      localStorage.setItem("dbs_admin_api_base", state.apiBase);
      sessionStorage.setItem("dbs_admin_token", state.token);
      try {
        showApp();
        await refreshAll();
        setNotice("#appNotice", "Connexion réussie.", "success");
      } catch (error) {
        logout();
        setNotice("#loginNotice", error.message, "error");
      }
    });

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", async () => {
        setActiveTab(button.dataset.tab);
        try {
          if (state.tab === "health") await loadHealth();
          else await loadRows();
        } catch (error) {
          setNotice("#appNotice", error.message, "error");
        }
      });
    });

    $("#summary").addEventListener("click", async (event) => {
      const metric = event.target.closest(".metric[data-target-tab]");
      if (!metric) return;
      setActiveTab(metric.dataset.targetTab);
      try {
        await loadRows();
        const target = state.tab === "ai" ? $("#aiPanel") : $("#dataPanel");
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#summary").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const metric = event.target.closest(".metric[data-target-tab]");
      if (!metric) return;
      event.preventDefault();
      metric.click();
    });

    $("#healthContent").addEventListener("input", (event) => {
      if (event.target.id !== "healthServiceSearch") return;
      state.healthServiceSearch = event.target.value;
      const cursor = event.target.selectionStart || state.healthServiceSearch.length;
      clearTimeout(state.healthSearchTimer);
      state.healthSearchTimer = setTimeout(() => {
        if (!state.health) return;
        renderHealth(state.health);
        const input = $("#healthServiceSearch");
        if (input) {
          input.focus();
          input.setSelectionRange(cursor, cursor);
        }
      }, 120);
    });

    $("#healthContent").addEventListener("change", (event) => {
      if (event.target.id === "healthServiceStatus") {
        state.healthServiceStatus = event.target.value;
        if (state.health) renderHealth(state.health);
      }
      if (event.target.id === "healthServicePriority") {
        state.healthServicePriority = event.target.value;
        if (state.health) renderHealth(state.health);
      }
      if (event.target.id === "healthServiceSort") {
        state.healthServiceSort = event.target.value;
        if (state.health) renderHealth(state.health);
      }
      if (event.target.id === "documentFormatFilter") {
        state.documentFormat = event.target.value;
        if (state.health) renderHealth(state.health);
      }
    });

    $("#aiContent").addEventListener("input", (event) => {
      if (!event.target.id.startsWith("aiFilter")) return;
      const map = {
        aiFilterDate: "date",
        aiFilterSession: "session",
        aiFilterType: "type",
        aiFilterModel: "model",
      };
      const key = map[event.target.id];
      if (!key) return;
      state.aiFilters[key] = event.target.value;
      renderAiDashboard(state.rows);
    });

    $("#aiContent").addEventListener("change", (event) => {
      const map = {
        aiFilterCategory: "category",
        aiFilterStatus: "status",
        aiFilterDate: "date",
      };
      const key = map[event.target.id];
      if (!key) return;
      state.aiFilters[key] = event.target.value;
      renderAiDashboard(state.rows);
    });

    $("#aiContent").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      try {
        if (button.dataset.action === "delete") await deleteRow(button.dataset.id);
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#filters").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const nextLimit = Number(form.get("limit") || state.limit);
      state.limit = Math.min(Math.max(Number.isFinite(nextLimit) ? Math.trunc(nextLimit) : 50, 1), 200);
      state.offset = 0;
      try {
        await loadRows();
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#tableBody").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      try {
        if (button.dataset.action === "status") await changeStatus(button.dataset.id, button.dataset.status);
        if (button.dataset.action === "delete") await deleteRow(button.dataset.id);
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#tableHead").addEventListener("change", (event) => {
      const checkbox = event.target.closest("#selectVisibleRows");
      if (!checkbox) return;
      for (const id of visibleRowIds()) {
        if (checkbox.checked) state.selectedIds.add(id);
        else state.selectedIds.delete(id);
      }
      renderTable();
    });

    $("#tableBody").addEventListener("change", (event) => {
      const checkbox = event.target.closest(".row-select");
      if (!checkbox) return;
      if (checkbox.checked) state.selectedIds.add(String(checkbox.dataset.id));
      else state.selectedIds.delete(String(checkbox.dataset.id));
      updateSelectionControls();
    });

    $("#prevBtn").addEventListener("click", async () => {
      state.offset = Math.max(state.offset - state.limit, 0);
      try {
        await loadRows();
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#nextBtn").addEventListener("click", async () => {
      state.offset += state.limit;
      try {
        await loadRows();
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#toggleSensitive").addEventListener("click", () => {
      state.showSensitive = !state.showSensitive;
      $("#toggleSensitive").textContent = state.showSensitive ? "Masquer détails" : "Afficher détails";
      if (state.tab !== "health") renderTable();
    });

    $("#refreshAll").addEventListener("click", async () => {
      try {
        await refreshAll();
        setNotice("#appNotice", "Données actualisées.", "success");
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#refreshHealthBtn").addEventListener("click", async () => {
      try {
        await loadHealth();
        if (!state.health?.fallback) setNotice("#appNotice", "Santé globale actualisée.", "success");
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#refreshAiBtn").addEventListener("click", async () => {
      try {
        await loadRows();
        setNotice("#appNotice", "Activités IA actualisées.", "success");
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#exportBtn").addEventListener("click", async () => {
      try {
        await exportJson();
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#bulkDeleteBtn").addEventListener("click", async () => {
      try {
        await bulkDeleteSelectedRows();
      } catch (error) {
        setNotice("#appNotice", error.message, "error");
      }
    });

    $("#logoutBtn").addEventListener("click", logout);

    document.querySelector(".back-link").addEventListener("click", (event) => {
      if (history.length <= 1) return;
      event.preventDefault();
      history.back();
    });

    if (state.token) {
      showApp();
      refreshAll().catch((error) => {
        logout();
        setNotice("#loginNotice", error.message, "error");
      });
    }
  </script>
