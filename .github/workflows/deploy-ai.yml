name: Deploy AI Worker

on:
  push:
    branches:
      - master
    paths:
      - "cloudflare/**"
      - "scripts/generate-build-info.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-ai.yml"

concurrency:
  group: deploy-ai-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-ai:
    name: Deploy digitalblueskye-ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate build info
        run: npm run build:info

      - name: Show generated build info
        run: |
          echo "Git short SHA:"
          git rev-parse --short HEAD
          echo "Build info files:"
          find . -maxdepth 3 -iname "*build*info*" -type f -print

      - name: Deploy AI Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c cloudflare/wrangler.ai.toml
